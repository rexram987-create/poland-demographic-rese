                      <p className="text-sm text-slate-300 leading-relaxed">המונח נגזר ישירות משמו של שבט סלאבי מערבי עתיק בשם "הפולאנים", אשר שכן באזור אגן נהר הוורטה (Warta) ההיסטורי שבמרכז-מערב פולין של ימינו. במאה ה-9 וה-10, שבט זה הצליח לאחד בכוח הזרוע ובבריתות פוליטיות את יתר השבטים הסלאביים באזור.</p>
                    </div>
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800/60">
                      <span className="block font-bold text-blue-300 text-base mb-1">Pole (פולה)</span>
                      <p className="text-sm text-slate-300 leading-relaxed">מקור המילה בשפה הפרוטו-סלאבית הקדומה שפירושה "שדה", "מישור לחקלאות" או "שטח פתוח נטול יערות עבותים". השם משקף נאמנה את הגיאוגרפיה והטופוגרפיה המישורית העצומה המאפיינת את רוב שטחה של המדינה.</p>
                    </div>
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800/60">
                      <span className="block font-bold text-blue-300 text-base mb-1">Polonia (פולוניה)</span>
                      <p className="text-sm text-slate-300 leading-relaxed">הגרסה הלטינית של השם. התיעוד הכתוב הראשון והמוכר בהיסטוריה של המונח הופיע בסביבות שנת 1000 לספירה, בכרוניקה של יוחנן קנאפריוס המתארת את חייו של אדלברט הקדוש מפרג.</p>
                    </div>
                    <div className="mt-4 p-4 bg-blue-950/20 border border-blue-900/40 rounded-xl text-sm">
                      <span className="font-bold text-blue-200">משמעות השם המלאה: </span>
                      <span className="text-slate-300">"ארצם של אנשי השדות" או "העם היושב במישורים". משמעות זו מקפלת בתוכה את הזהות ההיסטורית של עם חקלאי שישב באזור פתוח ומישורי, נטול גבולות טבעיים מובהקים.</span>
                    </div>
                  </div>
                </section>

                {/* 4. הסבר מקיף על דגל פולין */}
                <section className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-24 h-24 bg-red-600/5 rounded-full blur-2xl pointer-events-none"></div>
                  <div className="flex items-center gap-3 mb-4 text-red-400">
                    <Icon name="Flag" size={20} />
                    <h2 className="text-lg font-bold text-white">4. הסבר מקיף על הדגל הלאומי</h2>
                  </div>
                  <div className="space-y-4 text-sm leading-relaxed text-slate-300">
                    <div>
                      <h4 className="font-bold text-white mb-1.5 text-base border-b border-slate-800 pb-1">מבנה ויזואלי והגדרות חוקיות</h4>

                    </div>
                    <div>
                      <h4 className="font-bold text-white mb-1.5 text-base border-b border-slate-800 pb-1">הרלדיקה וסמליות הצבעים</h4>
                      <p>מקורם של צבעי הדגל הוא הרלדי לחלוטין, והצבעים נגזרים ישירות מסמל המדינה ההיסטורי המציג עיט לבן ומוכתר על רקע מגן אדום.</p>
                      <ul className="list-disc list-inside mt-2 space-y-1.5 text-slate-400 mr-2">
                        <li><strong className="text-slate-200">הצבע הלבן:</strong> מסמל את העיט הלבן האגדי של שבט הפולאנים. הלבן מייצג טוהר כוונות, שלום, שאיפה רוחנית עליונה ויושרה.</li>
                        <li><strong className="text-slate-200">הצבע האדום:</strong> מייצג את רקע המגן של שלט האצולה העתיק. מסמל גבורה עילאית, אומץ לב, ואת הדם הרב שניגר לאורך ההיסטוריה של העם הפולני.</li>
                      </ul>
                    </div>
                    <div>
                      <h4 className="font-bold text-white mb-1.5 text-base border-b border-slate-800 pb-1">התפתחות היסטורית</h4>
                      <p>האימוץ הרשמי של הלבן והאדום כצבעים הלאומיים התרחש ב-<strong className="text-white">7 בפברואר 1831</strong> במהלך "מרד נובמבר". לאחר שפולין זכתה מחדש בעצמאותה ב-1918, אישר הפרלמנט רשמית את הדגל במתכונתו הנוכחית ב-1 באוגוסט 1919.</p>

                  </div>
                </section>

                {/* 5. כלכלת פולין */}
                <section className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl relative overflow-hidden">
                  <div className="absolute top-[-20%] left-[-10%] w-32 h-32 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>
                  <div className="flex items-center gap-3 mb-4 text-emerald-400">

                    <h2 className="text-lg font-bold text-white">5. כלכלת פולין: מ"טיפול בהלם" למעצמה אזורית</h2>

                  <div className="space-y-4 text-sm leading-relaxed text-slate-300 text-justify">
                    <div>
                      <h4 className="font-bold text-white mb-1.5 text-base border-b border-slate-800 pb-1">הנס הכלכלי שלאחר הקומוניזם</h4>
                      <p>עם שחרור פולין ב-1989, הכלכלן לשק בלצרוביץ' הוביל תוכנית "טיפול בהלם" שהעבירה את פולין לכלכלת שוק. המהלך הוביל ל"נס כלכלי". כיום פולין היא הכלכלה ה-6 בגודלה באיחוד האירופי.</p>

                    </div>
                    <div>
                      <h4 className="font-bold text-white mb-1.5 text-base border-b border-slate-800 pb-1">מנועי צמיחה ותעשיות מפתח</h4>
                      <p>בעשור האחרון, פולין ביצעה זינוק טכנולוגי אדיר והפכה למוקד עולמי של שירותי IT, פיתוח תוכנה, וגיימינג (CD Projekt Red). ערי פולין מהוות מוקד פיתוח לחברות ענק בזכות כוח אדם מיומן.</p>
                    </div>
                  </div>
                </section>

                {/* 6. המטבע הלאומי */}
                <section className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl relative overflow-hidden">
                  <div className="absolute bottom-[-10%] right-[-10%] w-32 h-32 bg-amber-600/10 rounded-full blur-3xl pointer-events-none"></div>
                  <div className="flex items-center gap-3 mb-4 text-amber-400">
                    <Icon name="Landmark" size={20} />
                    <h2 className="text-lg font-bold text-white">6. המטבע הלאומי: זלוטי פולני (Złoty)</h2>

                  <div className="space-y-4 text-sm leading-relaxed text-slate-300 text-justify">
                    <div>
                      <h4 className="font-bold text-white mb-1.5 text-base border-b border-slate-800 pb-1">אטימולוגיה ומשמעות השם</h4>
                      <p>המילה <strong>"זלוטי" (Złoty)</strong> פירושה <strong>"זהוב"</strong>. המטבע מחולק ל-100 גרוש (Groszy) - מונח שפירושו המקורי "עבה".</p>
                    </div>
                    <div>
                      <h4 className="font-bold text-white mb-1.5 text-base border-b border-slate-800 pb-1">היפר-אינפלציה ודנומינציה</h4>
                      <p>בעקבות המעבר לשוק חופשי, פולין חוותה היפר-אינפלציה אדירה. בשנת 1995 הבנק המרכזי ביצע דנומינציה: 10,000 זלוטי ישנים הומרו ל-1 זלוטי פולני חדש (PLN).</p>

                      <p>אף על פי שפולין התחייבה לאמץ את האירו, המדינה שומרת בקנאות על עצמאותה המוניטרית והותירה את הזלוטי. הדבר איפשר לה שליטה בלעדית בשערי הריבית וגמישות כלכלית פנומנלית.</p>
                    </div>
                  </div>
                </section>

                {/* שנת הקמה והמייסד */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                  <section className="bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-xl">
                    <span className="flex items-center gap-2 text-emerald-400 font-bold mb-2">
                      <Icon name="Calendar" size={16} />
                      <span className="text-base">שנת ייסוד / הקמה</span>
                    </span>
                    <div className="space-y-2 text-slate-300 leading-relaxed">
                      <p><strong className="text-emerald-300">שנת 966 לספירה.</strong> "טבילת פולין". קבלת הנצרות הכניסה את פולין למשפחת העמים האירופיים.</p>
                    </div>
                  </section>
                  <section className="bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-xl">
                    <span className="flex items-center gap-2 text-amber-400 font-bold mb-2">
                      <Icon name="User" size={16} />
                      <span className="text-base">הבונה / המייסד</span>
                    </span>
                    <div className="space-y-2 text-slate-300 leading-relaxed">
                      <p><strong className="text-amber-300">מיישקו הראשון (Mieszko I).</strong> הדוכס הראשון מבית פיאסט. (חי 930–992 לספירה).</p>
                    </div>
                  </section>
                </div>

                {/* סיבת ההקמה, דמוגרפיה, היסטוריה */}
                <section className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl text-sm">
                  <span className="flex items-center gap-2 text-rose-400 font-bold mb-3"><Icon name="Target" size={18} /><h2 className="text-lg">סיבת ההקמה והמניע הגיאופוליטי</h2></span>
                  <p className="text-slate-300 leading-relaxed text-justify">איחוד השבטים הסלאביים תחת שלטון ודת משותפת (נצרות קתולית) נועד ליצור כוח צבאי ומדיני איתן כנגד פלישות שכנים (במיוחד האימפריה הרומית הקדושה), ולמצב את פולין ככוח מוכר באירופה.</p>
                </section>

                <section className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl text-sm">
                  <span className="flex items-center gap-2 text-cyan-400 font-bold mb-3"><Icon name="Users" size={18} /><h2 className="text-lg">דמוגרפיה ומבנה חברתי</h2></span>
                  <p className="text-slate-300 leading-relaxed">כ-37.6 מיליון תושבים. למעלה מ-97% מזדהים כפולנים אתנים. קיימת מגמת ילודה נמוכה והגירה מערבה, לצד קליטה מסיבית של מהגרים מאוקראינה.</p>
                </section>

                <section className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl text-sm relative overflow-hidden mb-12">
                  <div className="absolute bottom-0 right-0 w-48 h-48 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
                  <span className="flex items-center gap-2 text-purple-400 font-bold mb-4 relative z-10"><Icon name="ShieldAlert" size={18} /><h2 className="text-lg">היסטוריה, ילדות האומה ואידאולוגיה</h2></span>
                  <div className="space-y-5 text-slate-300 leading-relaxed text-justify relative z-10">
                    <div>
                      <p>בשיא כוחה יצרה פולין את האיחוד הפולני-ליטאי שהתבסס על אידאולוגיית "חירות הזהב" – דמוקרטיית אצולה ייחודית. בסוף המאה ה-18 פולין חוותה שלוש חלוקות ונמחקה מהמפה עד 1918. לאחר חורבן מלחמת העולם ה-2 ושלטון קומוניסטי, תנועת "סולידריות" בהנהגת לך ולנסה הפילה את המשטר הסובייטי. חלוצה דמוקרטית (חוקת 3 במאי 1791) וכלכלה צומחת.</p>
                    </div>
                  </div>
                </section>

              </article>

              {/* Modal לתגובות */}
              {isNotesModalOpen && (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/80 backdrop-blur-sm animate-in fade-in">
                  <div className="bg-slate-900 border-t sm:border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom-8">
                    <div className="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
                      <div className="flex items-center gap-2 text-blue-400"><Icon name="MessageSquare" size={16} /><h3 className="font-bold text-white text-base">תגובות והערות מחקר</h3></div>
                      <button onClick={() => setIsNotesModalOpen(false)} className="p-1 rounded-full hover:bg-slate-800 text-slate-400 hover:text-white transition-colors"><Icon name="X" size={16} /></button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-950/40">
                      {notes.map((note) => (
                        <div key={note.id} className="bg-slate-900 p-3.5 rounded-2xl border border-slate-800/80 space-y-1">
                          <div className="flex justify-between items-center text-xs"><span className="font-bold text-blue-400">{note.author}</span><span className="text-slate-500 font-mono">{note.date}</span></div>
                          <p className="text-sm text-slate-200 leading-relaxed">{note.text}</p>

                      ))}
                    </div>
                    <form onSubmit={handleAddNote} className="p-4 border-t border-slate-800 bg-slate-900">
                      <div className="flex gap-2">
                        <input type="text" value={newNote} onChange={(e) => setNewNote(e.target.value)} placeholder="הוסף הערה או תובנה חדשה למחקר..." className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" />
                        <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-xl transition-colors flex items-center justify-center shadow-md w-12"><Icon name="Send" size={16} /></button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // ==========================================
        // MAIN APP COMPONENT (Router)
        // ==========================================
        function App() {
          const [currentView, setCurrentView] = useState('index');

          if (currentView === 'poland') {
            return <PolandDetail onBack={() => setCurrentView('index')} />;
          }

          return <IndexBubbles onNavigate={(pageId) => {
            if (pageId === 'poland') {
              setCurrentView('poland');
            } else {
              console.log(`Page ${pageId} is not built yet.`);
              alert(`המחקר עבור ${pageId} נמצא כעת בבנייה.`);
            }
          }} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
